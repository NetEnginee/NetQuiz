server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/webfeed/html/public;
    client_max_body_size 25M;

    # 1. Enable Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # 2. Block Hidden Files and Internal Paths (.git, .env, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 3. Block Access to Internal Application Folders
    location ~* ^/(app|config|logs)/ {
        deny all;
        return 404;
    }

    # 4. Strict Uploads Security: Serve Only Static Assets (Disable PHP Script Execution)
    location ^~ /uploads/ {
        location ~ \.(php|phtml|phar|php[0-9]?)(\.|\/|$) {
            deny all;
            return 403;
        }
        try_files $uri =404;
    }

    # 5. Static Assets Caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # 6. Dynamic PHP Request Handling (Only public/index.php)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass cpu-php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # FastCGI Buffering & Timeouts
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 600;
    }

    # 7. Clean URLs / Framework Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}